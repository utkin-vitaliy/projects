name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capsule-shelf
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capsule-shelf/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: Run Offday data tests
        run: node --test ../canada-days/calendar-data.test.js
      - name: Build static site
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
        run: npm run build
      - name: Prepare nested Pages artifact
        run: |
          mkdir -p pages-artifact/capsule-shelf
          cp -R dist/. pages-artifact/capsule-shelf/
          mkdir -p pages-artifact/canada-days
          cp -R ../canada-days/. pages-artifact/canada-days/
          cat > pages-artifact/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <meta name="theme-color" content="#f5f2ec">
              <meta name="description" content="A collection of static web projects by Vitaliy.">
              <title>Projects — Vitaliy</title>
              <style>
                :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #292820; background: #f5f2ec; font-synthesis: none; }
                * { box-sizing: border-box; }
                body { min-width: 320px; margin: 0; }
                main { width: min(100% - 40px, 1080px); margin: 0 auto; padding: clamp(48px, 9vw, 112px) 0 72px; }
                .eyebrow { margin: 0 0 20px; color: #777466; font-size: 12px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; }
                h1 { max-width: 760px; margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: clamp(44px, 8vw, 82px); font-weight: 400; letter-spacing: -.055em; line-height: .98; }
                .intro { max-width: 520px; margin: 24px 0 0; color: #6f6d63; font-size: 17px; line-height: 1.65; }
                .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; margin-top: 64px; }
                .project { position: relative; display: flex; min-height: 270px; flex-direction: column; align-items: flex-start; padding: 30px; overflow: hidden; border: 1px solid #e3dfd5; border-radius: 22px; background: linear-gradient(145deg, #fffefa, #eeece4); box-shadow: 0 12px 36px rgb(53 48 34 / 5%); text-decoration: none; color: inherit; transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease; }
                .project:hover { transform: translateY(-4px); border-color: #d4cbb9; box-shadow: 0 20px 44px rgb(53 48 34 / 10%); }
                .project:focus-visible { outline: 3px solid #9b8767; outline-offset: 4px; }
                .icon { display: grid; width: 48px; height: 48px; place-items: center; border: 1px solid #e1dacb; border-radius: 50%; background: #f7f3ea; font-size: 23px; }
                .icon img { width: 28px; height: 28px; }
                .meta { margin: 28px 0 9px; color: #777466; font-size: 11px; font-weight: 650; letter-spacing: .13em; text-transform: uppercase; }
                h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 31px; font-weight: 400; letter-spacing: -.035em; }
                .description { max-width: 380px; margin: 12px 0 28px; color: #6f6d63; font-size: 15px; line-height: 1.55; }
                .open { display: inline-flex; align-items: center; gap: 9px; margin-top: auto; color: #504637; font-size: 14px; font-weight: 650; }
                .arrow { transition: transform .2s ease; }
                .project:hover .arrow { transform: translate(3px, -3px); }
                footer { margin-top: 58px; color: #89867c; font-size: 12px; }
                @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
              </style>
            </head>
            <body>
              <main>
                <p class="eyebrow">A personal collection</p>
                <h1>Projects that<br>make life simpler.</h1>
                <p class="intro">Small web tools and ideas, all gathered in one place.</p>
                <section class="projects" aria-label="Project list">
                  <a class="project" href="/projects/capsule-shelf/">
                    <span class="icon" aria-hidden="true"><img src="/projects/capsule-shelf/favicon.svg" alt=""></span>
                    <p class="meta">Nespresso Original · capsule tracker</p>
                    <h2>Capsule Shelf</h2>
                    <p class="description">Track capsule quantities, favorite coffees, tasting notes, and recipes in one place.</p>
                    <span class="open">Open project <span class="arrow" aria-hidden="true">↗</span></span>
                  </a>
                  <a class="project" href="/projects/canada-days/">
                    <span class="icon" aria-hidden="true"><img src="/projects/canada-days/calendar-mark.svg" alt=""></span>
                    <p class="meta">Canada · holiday calendar</p>
                    <h2>Offday</h2>
                    <p class="description">Explore upcoming work-calendar dates across Canada, with separate employment standards and public-service references.</p>
                    <span class="open">Open project <span class="arrow" aria-hidden="true">↗</span></span>
                  </a>
                </section>
                <footer>More static projects will appear here.</footer>
              </main>
            </body>
          </html>
          EOF
      - name: Create sitemap
        run: |
          cat > pages-artifact/sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url><loc>https://utkin-vitaliy.github.io/projects/</loc></url>
            <url><loc>https://utkin-vitaliy.github.io/projects/capsule-shelf/</loc></url>
            <url><loc>https://utkin-vitaliy.github.io/projects/canada-days/</loc></url>
          </urlset>
          EOF
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: capsule-shelf/pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
