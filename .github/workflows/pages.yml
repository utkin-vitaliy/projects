name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capsule-shelf
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: capsule-shelf/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test -- --run
      - name: Build static site
        run: npm run build
      - name: Prepare nested Pages artifact
        run: |
          mkdir -p pages-artifact/capsule-shelf
          cp -R dist/. pages-artifact/capsule-shelf/
          cat > pages-artifact/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">
              <meta http-equiv="refresh" content="0; url=/projects/capsule-shelf/">
              <meta name="robots" content="noindex">
              <title>Capsule Shelf</title>
            </head>
            <body>
              <p>Capsule Shelf has moved to <a href="/projects/capsule-shelf/">its new address</a>.</p>
              <script>location.replace("/projects/capsule-shelf/" + location.search + location.hash)</script>
            </body>
          </html>
          EOF
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: capsule-shelf/pages-artifact

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
